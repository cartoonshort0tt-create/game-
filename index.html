<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>GameArena — 1v1 Game Lobby</title>
<meta name="description" content="Compete 1v1 in classic games with a virtual coin economy, bots, and cartoon-animated matches." />
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎮</text></svg>" />
<link rel="stylesheet" href="css/base.css" />
<link rel="stylesheet" href="css/theme.css" />
<link rel="stylesheet" href="css/animations.css" />
</head>
<body>

<div class="app-shell">

  <header class="app-header">
    <div class="brand"><span class="logo">🎮</span> GameArena</div>
    <div class="header-right">
      <button class="pill" id="profilePillBtn" title="Edit profile">
        <span class="pill-avatar" id="profileAvatarIcon" style="background:#eee;">🦊</span>
        <span id="profileNameLabel">Player</span>
      </button>
      <div class="pill wallet-pill">
        <span class="coin-icon">🪙</span>
        <span id="walletBalanceLabel">0</span>
      </div>
    </div>
  </header>

  <main id="screenLobby">
    <div class="section-title">🕹️ Choose a game</div>
    <div class="game-grid" id="gameGrid"></div>
  </main>

  <section id="screenRps" class="hidden">
    <div class="rps-screen">
      <div class="rps-scoreboard">
        <div class="rps-player-tag">
          <span id="rpsPlayerIcon">🦊</span>
          <span id="rpsPlayerNameLabel">You</span>
          <span class="score-dots" id="rpsPlayerDots"></span>
        </div>
        <div class="rps-vs-label">VS</div>
        <div class="rps-player-tag">
          <span class="score-dots" id="rpsBotDots"></span>
          <span id="rpsBotNameLabel">Bot</span>
          <span id="rpsBotIcon">🐣</span>
        </div>
      </div>

      <div class="round-result-text" id="rpsRoundResultText"></div>

      <div class="rps-arena">
        <div class="rps-hand" id="rpsPlayerHand">✊</div>
        <div class="rps-hand" id="rpsBotHand">✊</div>
      </div>

      <div class="choice-row" id="rpsChoiceRow">
        <button class="choice-btn" data-choice="rock" title="Rock">🪨</button>
        <button class="choice-btn" data-choice="paper" title="Paper">📄</button>
        <button class="choice-btn" data-choice="scissors" title="Scissors">✂️</button>
      </div>

      <button class="rps-quit" id="rpsForfeitBtn">Forfeit match</button>
    </div>
  </section>

</div>

<!-- Avatar / Profile modal -->
<div class="overlay hidden" id="avatarOverlay">
  <div class="modal-card">
    <button class="modal-close" id="avatarCloseBtn">✕</button>
    <h2>Your Profile</h2>
    <label for="nameInput" style="font-weight:700;font-size:0.85rem;color:var(--ink-soft);">Display name</label>
    <input type="text" id="nameInput" class="text-input" maxlength="20" />
    <div style="font-weight:700;font-size:0.85rem;color:var(--ink-soft);margin-bottom:6px;">Avatar</div>
    <div class="emoji-grid" id="emojiGrid"></div>
    <div style="font-weight:700;font-size:0.85rem;color:var(--ink-soft);margin-bottom:6px;">Color</div>
    <div class="color-row" id="colorRow"></div>
    <div style="display:flex;gap:14px;margin:10px 0 16px;font-size:0.9rem;color:var(--ink-soft);font-weight:700;">
      <span id="statWins">0W</span>
      <span id="statLosses">0L</span>
      <span id="statDraws">0D</span>
      <span id="statRating">1000 rating</span>
    </div>
    <button class="btn btn-primary" id="saveProfileBtn" style="width:100%;">Save</button>
  </div>
</div>

<!-- Stake / opponent select modal -->
<div class="overlay hidden" id="stakeOverlay">
  <div class="modal-card">
    <button class="modal-close" id="stakeCloseBtn">✕</button>
    <h2 id="stakeModalTitle">Rock · Paper · Scissors</h2>

    <div style="font-weight:700;font-size:0.85rem;color:var(--ink-soft);margin-bottom:6px;">Choose your opponent</div>
    <div class="tier-row" id="tierRow">
      <button class="chip" data-tier="rookie">🐣 Pip (Rookie)</button>
      <button class="chip" data-tier="skilled">🦝 Chip (Skilled)</button>
      <button class="chip" data-tier="master">🐲 Byte (Master)</button>
    </div>

    <div style="font-weight:700;font-size:0.85rem;color:var(--ink-soft);margin-bottom:6px;">Choose your stake</div>
    <div class="stake-row" id="stakeRow">
      <button class="chip" data-stake="0">Practice (Free)</button>
      <button class="chip" data-stake="10">🪙 10</button>
      <button class="chip" data-stake="25">🪙 25</button>
      <button class="chip" data-stake="50">🪙 50</button>
      <button class="chip" data-stake="100">🪙 100</button>
    </div>

    <div class="stake-balance-note" id="stakeBalanceNote"></div>

    <button class="btn btn-primary" id="startMatchBtn" style="width:100%;">Start Match</button>
  </div>
</div>

<!-- Match intro overlay -->
<div class="overlay hidden" id="introOverlay">
  <div class="vs-wrap">
    <div class="vs-avatars">
      <div class="vs-avatar" id="introPlayerAvatar">🦊</div>
      <div class="vs-text">VS</div>
      <div class="vs-avatar" id="introBotAvatar">🐣</div>
    </div>
    <div id="introNamesLine" style="font-weight:800;"></div>
    <div class="vs-stake" id="introStakeLine"></div>
    <div class="countdown-num" id="introCountdown">3</div>
  </div>
</div>

<!-- Results overlay -->
<div class="overlay hidden" id="resultsOverlay">
  <div class="modal-card results-card">
    <div class="results-emoji" id="resultsEmoji">🏆</div>
    <div class="results-title" id="resultsTitle">You Win!</div>
    <div id="resultsScoreLine" style="color:var(--ink-soft);font-weight:700;"></div>
    <div class="coin-delta" id="resultsCoinDelta"></div>
    <div class="results-actions">
      <button class="btn btn-secondary" id="resultsLobbyBtn">Back to Lobby</button>
      <button class="btn btn-primary" id="resultsAgainBtn">Play Again</button>
    </div>
  </div>
</div>

<div class="confetti-layer" id="confettiLayer"></div>
<div class="toast hidden" id="toast"></div>

<script src="js/core/wallet.js"></script>
<script src="js/core/profile.js"></script>
<script src="js/core/matchHistory.js"></script>
<script src="js/games/rps/engine.js"></script>
<script src="js/ui/confetti.js"></script>
<script src="js/main.js"></script>
</body>
</html>
